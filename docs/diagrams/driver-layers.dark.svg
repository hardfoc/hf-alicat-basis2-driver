<text x="56" y="633.7" font-size="17" fill="#D2DAE4">BuildReadHolding  BuildWriteSingle  BuildWriteMultiple  ParseReadHolding  ParseWriteSingleEcho  ParseWriteMultipleEcho</text>
<text x="56" y="732.4" font-size="20" font-weight="700" fill="#A7F3E6">Platform port (your class, derived from UartInterface)</text>
<text x="56" y="761.6" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">write()  read()  flush_rx()  delay_ms_impl()</text>
