<text x="48" y="307.4" font-size="17" font-weight="700" fill="#3730A3">HARDWARE-AGNOSTIC CORE</text>
<text x="326.2" y="307.4" font-size="16" fill="#3730A3">Driver&lt;UartT&gt;, inc/alicat_basis2.hpp</text>
<text x="56" y="578.4" font-size="20" font-weight="700" fill="#3730A3">Modbus-RTU framing</text>
<text x="56" y="609" font-size="17" fill="#2B3442">functions 03, 06 and 16, CRC-16 on every frame, replies checked against the request:</text>
<text x="56" y="633.7" font-size="17" fill="#2B3442">BuildReadHolding  BuildWriteSingle  BuildWriteMultiple  ParseException  ParseReadHolding  ParseWriteSingleEcho </text>
<text x="56" y="658.3" font-size="17" fill="#2B3442">ParseWriteMultipleEcho</text>
<text x="56" y="756.4" font-size="20" font-weight="700" fill="#115E59">Platform port (your class, derived from UartInterface)</text>
<text x="56" y="785.6" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#2B3442">write()  read()  flush_rx()  delay_ms_impl()  log_impl()</text>
<text x="56" y="884.4" font-size="20" font-weight="700" fill="#17202C">UART, transceiver, BASIS-2 instruments</text>
<text x="56" y="915" font-size="17" fill="#2B3442">RS-485 multidrop (addresses 1 to 247) or RS-232, 8N1, 4800 to 115200 baud</text>
